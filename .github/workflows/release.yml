name: Release

# Builds and publishes a GitHub release from a version tag on main. The version comes entirely from
# the tag, so changing the versioning rule needs no change here. See CONTRIBUTING.md.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CONFIGURATION: Release
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  CYCLONEDX_VERSION: 6.3.1

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Needed to confirm the tag is on main.
          persist-credentials: false

      - name: Validate tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a valid version tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::'$TAG' does not point at a commit on main"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Iskender.sln --locked-mode

      - name: Build
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: dotnet build Iskender.sln --configuration "$CONFIGURATION" --no-restore -warnaserror -p:Version="$VERSION"

      - name: Test
        run: dotnet test --solution Iskender.sln --configuration "$CONFIGURATION" --no-build

      - name: Pack
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: dotnet pack Iskender.sln --configuration "$CONFIGURATION" --no-build -p:Version="$VERSION" --output artifacts/packages

      - name: Generate SBOM
        run: |
          dotnet tool install CycloneDX --version "$CYCLONEDX_VERSION" --tool-path "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/dotnet-CycloneDX" Iskender.sln --output artifacts/sbom --output-format Json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/packages/*.nupkg
            artifacts/sbom/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" artifacts/packages/*.nupkg artifacts/sbom/* \
            --verify-tag --generate-notes --title "$TAG" "${prerelease[@]}"
