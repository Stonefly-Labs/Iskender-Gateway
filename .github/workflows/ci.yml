name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: Release
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  CYCLONEDX_VERSION: 6.3.1

jobs:
  # "ci" is the required status check named in docs/18-branch-protection.md.
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Secret scanning reads the full history.
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: "1. Restore"
        run: dotnet restore Iskender.sln --locked-mode

      - name: "2. Format"
        run: dotnet format Iskender.sln --verify-no-changes --no-restore

      - name: "3. Build"
        run: dotnet build Iskender.sln --configuration "$CONFIGURATION" --no-restore -warnaserror

      - name: "4. Test"
        run: dotnet test --solution Iskender.sln --configuration "$CONFIGURATION" --no-build

      - name: "5. Architecture and dependency rules"
        run: dotnet test --project tests/Iskender.Architecture.Tests --configuration "$CONFIGURATION" --no-build

      - name: "6. Docs, links, manifest and inventory"
        run: bash .github/scripts/check-grounding.sh

      - name: "7. Documentation merge gate"
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/docs-gate.sh

      - name: "8. Secret scan"
        run: |
          curl --fail --silent --show-error --location --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          rm gitleaks.tar.gz
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner .

      - name: "9. Dependency hygiene"
        run: |
          dotnet list Iskender.sln package --vulnerable --include-transitive | tee "$RUNNER_TEMP/vulnerable.txt"
          if grep --quiet "has the following vulnerable packages" "$RUNNER_TEMP/vulnerable.txt"; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: "10a. Generate SBOM"
        run: |
          dotnet tool install CycloneDX --version "$CYCLONEDX_VERSION" --tool-path "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/dotnet-CycloneDX" Iskender.sln --output artifacts/sbom --output-format Json

      - name: "10b. Upload SBOM"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: artifacts/sbom/
          if-no-files-found: error

      # Fork PRs get no id-token permission. They record checksums instead, the documented local
      # equivalent to an attestation (see docs/18-branch-protection.md).
      - name: "10c. Attest build provenance"
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            artifacts/sbom/*
            src/Iskender.Gateway.Host/bin/${{ env.CONFIGURATION }}/net10.0/Iskender.Gateway.Host.dll

      - name: "10c. Record checksums for a fork PR"
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          sha256sum artifacts/sbom/* "src/Iskender.Gateway.Host/bin/$CONFIGURATION/net10.0/Iskender.Gateway.Host.dll" \
            | tee -a "$GITHUB_STEP_SUMMARY"
