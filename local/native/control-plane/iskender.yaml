# ISK-0008 native run: mirrors local/config/control-plane/iskender.yaml for a host run with dotnet against the
# dependencies mode (local-environment contract, Native runs rule 1). Only the lines that rule lists differ.
# A PostgreSQL port override reaches a native host through ISKENDER__PERSISTENCE__PORT. A Valkey port override needs
# an edited copy of this directory, because redis.endpoints is an array that no variable can set.
iskender:
  container:
    trafficTransport: upstream
    trafficPort: 8090
    healthPort: 8091
  persistence:
    host: 127.0.0.1
    port: 15432
    database: iskender_local
    username: iskender_local_runtime
    password:
      secretRef: local/postgres-runtime
    migration:
      username: iskender_local_migrator
      password:
        secretRef: local/postgres-migration
