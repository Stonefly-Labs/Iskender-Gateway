# ISK-0008 developer topology: the control plane's base document, also read by the migrate job (local-environment
# contract, Documents rule 2). It holds no development-only value, so it validates alone with no environment name. The
# passwords are secret references, which no credential provider resolves before ISK-0021.
iskender:
  persistence:
    host: postgres
    database: iskender_local
    username: iskender_local_runtime
    password:
      secretRef: local/postgres-runtime
    migration:
      username: iskender_local_migrator
      password:
        secretRef: local/postgres-migration
