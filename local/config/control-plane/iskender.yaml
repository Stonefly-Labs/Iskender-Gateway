# ISK-0008 developer topology: the control plane's base document, also read by the migrate and bootstrap jobs
# (local-environment contract, Documents rule 2). It holds no development-only value, so it validates alone with no
# environment name: from version 3 its traffic transport is upstream, a mode valid outside development. The
# passwords are secret references, which no credential provider resolves before ISK-0021.
iskender:
  container:
    trafficTransport: upstream
  persistence:
    host: postgres
    database: iskender_local
    username: iskender_local_runtime
    password:
      secretRef: local/postgres-runtime
    migration:
      username: iskender_local_migrator
      password:
        secretRef: local/postgres-migration
